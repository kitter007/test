<html>
    <head>
        <title>My Table</title>
    </head>
    <body>
        <table border="1" 
        cellspacing="0" 
        cellpadding="10"
        width="500"
        height="200"
        align="center"
        >
            <tr height="300">
                <td colspan="3">แถวที่ 1 คอลัมน์ 1</td>
                <!-- <td>แถวที่ 1 คอลัมน์ 2</td> -->
                <!-- <td>แถวที่ 1 คอลัมน์ 3</td> -->
            </tr>
            <tr>
                <td rowspan="3">แถวที่ 2 คอลัมน์ 1</td>
                <td>แถวที่ 2 คอลัมน์ 2</td>
                <td>แถวที่ 2 คอลัมน์ 3</td>
            </tr>
            <tr>
                <!-- <td>แถวที่ 3 คอลัมน์ 1</td> -->
                <td>แถวที่ 3 คอลัมน์ 2</td>
                <td>แถวที่ 3 คอลัมน์ 3</td>
            </tr>
            <tr>
                <!-- <td>แถวที่ 4 คอลัมน์ 1</td> -->
                <td>แถวที่ 4 คอลัมน์ 2</td>
                <td>แถวที่ 4 คอลัมน์ 3</td>
            </tr>
        </table>
    </body>
</html>
